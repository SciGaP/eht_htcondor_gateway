<!-- **************************************************************************
        Header

        -> rivet.iu.edu/components/header/
*************************************************************************** -->

<header class="rvt-header-wrapper">
        
    <!-- **********************************************************************
            "Skip to main content" link for keyboard users
    *********************************************************************** -->

    <a class="rvt-header-wrapper__skip-link" href="#main-content">Skip to main content</a>
    
    <!-- **********************************************************************
            Global header area
    *********************************************************************** -->
    
    <div class="rvt-header-global" >
            <div class="rvt-container-lg" style="height:40px;">
                    <div class="rvt-header-global__inner">
                            <div class="rvt-header-global__logo-slot">
                                    <a class="rvt-lockup" href="{{ url_for('website.home') }}">
                                            
                                            <!-- **************************************************
                                                    Trident logo
                                            *************************************************** -->

                                            <div>
                                                    <img src="{{ url_for('static', filename='image/eht_logo.png') }}" alt="EHT Logo" style="width:40px;height:40px;">
                                            </div>

                                            <!-- **************************************************
                                                    Application title 
                                            *************************************************** -->

                                            <div class="rvt-lockup__body">
                                                <span class="rvt-lockup__title">Event Horizon Telescope</span>
                                                <span class="rvt-lockup__subtitle"><strong>HTCondor Portal</strong></span>
                                            </div>
                                    </a>
                            </div>
                            <div class="rvt-header-global__controls">
                                    <div data-rvt-disclosure="menu" data-rvt-close-click-outside>
                                            <button aria-expanded="false" class="rvt-global-toggle rvt-global-toggle--menu rvt-hide-lg-up" data-rvt-disclosure-toggle="menu">
                                                    <span class="rvt-sr-only">Menu</span>
                                                    <svg class="rvt-global-toggle__open" fill="currentColor" width="16" height="16" viewBox="0 0 16 16"><path d="M15 4H1V2h14v2Zm0 5H1V7h14v2ZM1 14h14v-2H1v2Z"></path></svg>
                                                    <svg class="rvt-global-toggle__close" fill="currentColor" width="16" height="16" viewBox="0 0 16 16"><path d="m3.5 2.086 4.5 4.5 4.5-4.5L13.914 3.5 9.414 8l4.5 4.5-1.414 1.414-4.5-4.5-4.5 4.5L2.086 12.5l4.5-4.5-4.5-4.5L3.5 2.086Z"></path></svg>
                                            </button>

                                            <!-- ******************************************************
                                                    Primary navigation
                                            ******************************************************* -->

                                            <nav aria-label="Main" class="rvt-header-menu" data-rvt-disclosure-target="menu" hidden>
                                                    <ul class="rvt-header-menu__list">
                                                            <li class="rvt-header-menu__item">
                                                                    <a class="rvt-header-menu__link" href="{{ url_for('website.home') }}">Home</a>
                                                            </li>
                                                            <li class="rvt-header-menu__item">
                                                                    <a class="rvt-header-menu__link" href="{{ url_for('website.about') }}">About</a>
                                                            </li>

                                                    <!-- **************************************************
                                                            Avatar and "log out" link
                                                    *************************************************** -->
                                                    {% if user.is_authenticated %}
                                                    <div class="username-box">
                                                            <div class="rvt-flex rvt-items-center rvt-m-left-md rvt-p-bottom-md rvt-p-bottom-none-lg-up">
                                                                    <div class="rvt-avatar rvt-avatar--xs">
                                                                            <img src="{{ user.profile_picture }}" alt="User avatar">
                                                                    </div>
                                                                    <div class="rvt-ts-14 rvt-m-left-xs rvt-p-right-xs rvt-m-right-xs rvt-border-right"><strong>{{ user.nickname }}</strong></div>
                                                                    <a href="{{ url_for('user.logout') }}" class="rvt-ts-14">Log out</a>
                                                            </div>
                                                    </div>
                                                    {% else %}
                                                    <div class="username-box">
                                                            <div class="rvt-flex rvt-items-center rvt-m-left-md rvt-p-bottom-md rvt-p-bottom-none-lg-up">
                                                                    <a href="{{ url_for('user.login') }}" class="rvt-ts-14">Log in</a>
                                                            </div>
                                                    </div>
                                                    {% endif %}
                                            </nav>
                                    </div>
                            </div>
                    </div>
            </div>
    </div>
</header>
